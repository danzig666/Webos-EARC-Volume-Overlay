name: Release

# Builds the IPK (native watcher + web app) and publishes a GitHub release.
# Runs automatically when a push to main carries a version in
# app/appinfo.json that has no release yet. It can also be started by pushing
# a matching tag (e.g. v1.5.1) or from Actions -> Release -> Run workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.check.outputs.publish }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Decide whether to publish
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('app/appinfo.json')).version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app/appinfo.json version $VERSION"
            exit 1
          fi
          PUBLISH=true
          if [ "$GITHUB_EVENT_NAME" = "push" ] && [ "$GITHUB_REF_TYPE" = "branch" ] \
            && gh release view "v$VERSION" >/dev/null 2>&1; then
            PUBLISH=false
            echo "Release v$VERSION already exists; nothing to publish." >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "publish=$PUBLISH" >> "$GITHUB_OUTPUT"

  release:
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: armv7-unknown-linux-musleabihf,aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: watcher-rs
      - run: pip install ziglang cargo-zigbuild

      - run: npm ci
      - run: npm test
      - run: npm run package
      - run: node scripts/release-metadata.mjs

      - name: Collect assets
        run: |
          mkdir -p dist
          cp build/com.github.nikolay1243.earcvolume_${{ needs.check.outputs.version }}_all.ipk dist/
          cp build/release/*.manifest.json build/release/repo.json dist/
          cp build/native/earc-watcher-armv7 build/native/earc-watcher-aarch64 dist/
          (cd dist && sha256sum * > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.check.outputs.tag }}
        run: |
          NOTES="docs/releases/$TAG.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "eARC Volume Overlay $TAG" --notes-file "$NOTES"
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "eARC Volume Overlay $TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
          echo "Homebrew Channel repository URL: https://github.com/$GH_REPO/releases/latest/download/repo.json" >> "$GITHUB_STEP_SUMMARY"
